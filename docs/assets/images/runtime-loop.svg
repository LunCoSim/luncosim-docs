<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">From authored files to a live world</title>
<desc id="desc">Authored sources are composed, the fixed-step engine advances, Rhai responds to events, and presentation produces inspectable evidence.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0b7285"/>
  </marker>
</defs>
<style>
  .canvas { fill: #f3f7f9; }
  .title { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -.3px; }
  .subtitle { fill: #5e707d; font-family: system-ui, sans-serif; font-size: 15px; }
  .eyebrow { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
  .node-title { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; }
  .body { fill: #243847; font-family: system-ui, sans-serif; font-size: 15px; }
  .label { fill: #5e707d; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
  .callout-text { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
</style>
<rect class="canvas" width="1000" height="580" rx="12"/>
<text class="title" x="40" y="46">From authored files to a live world</text>
<text class="subtitle" x="40" y="74">Commands and input return to the next fixed step; presentation never owns simulation state.</text><rect x="40" y="120" width="290" height="132" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="40" y="134" width="5" height="104" rx="2.5" fill="#0b7285"/>
<text class="eyebrow" x="60" y="148" fill="#0b7285">01  AUTHOR</text>
<text class="node-title" x="60" y="176">Twin sources</text>
<text class="body" x="60" y="202" fill="#5e707d" font-size="15px"><tspan x="60" dy="0">USD · Modelica</tspan><tspan x="60" dy="20">Rhai · Assets.toml</tspan></text><rect x="355" y="120" width="290" height="132" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="355" y="134" width="5" height="104" rx="2.5" fill="#28785e"/>
<text class="eyebrow" x="375" y="148" fill="#28785e">02  COMPOSE</text>
<text class="node-title" x="375" y="176">Build the world</text>
<text class="body" x="375" y="202" fill="#5e707d" font-size="15px"><tspan x="375" dy="0">Resolve layers and arcs</tspan><tspan x="375" dy="20">Project prims to entities</tspan></text><rect x="670" y="120" width="290" height="132" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="670" y="134" width="5" height="104" rx="2.5" fill="#6951a1"/>
<text class="eyebrow" x="690" y="148" fill="#6951a1">03  ADVANCE</text>
<text class="node-title" x="690" y="176">Fixed-step engine</text>
<text class="body" x="690" y="202" fill="#5e707d" font-size="15px"><tspan x="690" dy="0">Modelica exchange</tspan><tspan x="690" dy="20">Avian physics</tspan></text><rect x="670" y="300" width="290" height="132" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="670" y="314" width="5" height="104" rx="2.5" fill="#a96320"/>
<text class="eyebrow" x="690" y="328" fill="#a96320">04  RESPOND</text>
<text class="node-title" x="690" y="356">Rhai policy</text>
<text class="body" x="690" y="382" fill="#5e707d" font-size="15px"><tspan x="690" dy="0">Events and objectives</tspan><tspan x="690" dy="20">Typed commands</tspan></text><rect x="355" y="300" width="290" height="132" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="355" y="314" width="5" height="104" rx="2.5" fill="#0b7285"/>
<text class="eyebrow" x="375" y="328" fill="#0b7285">05  PRESENT</text>
<text class="node-title" x="375" y="356">Live view</text>
<text class="body" x="375" y="382" fill="#5e707d" font-size="15px"><tspan x="375" dy="0">Scene, HUD and graphs</tspan><tspan x="375" dy="20">Bounded UI updates</tspan></text><rect x="40" y="300" width="290" height="132" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="40" y="314" width="5" height="104" rx="2.5" fill="#28785e"/>
<text class="eyebrow" x="60" y="328" fill="#28785e">06  VERIFY</text>
<text class="node-title" x="60" y="356">Inspect evidence</text>
<text class="body" x="60" y="382" fill="#5e707d" font-size="15px"><tspan x="60" dy="0">Ports, state and tests</tspan><tspan x="60" dy="20">Screenshots and verdicts</tspan></text><path d="M330 186 L348 186" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M645 186 L663 186" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M815 252 L815 293" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M670 366 L653 366" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M355 366 L338 366" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M185 432 V480 H978 V186 H960" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="label" x="458" y="501" fill="#5e707d">typed input and commands seed the next fixed step</text><rect x="40" y="520" width="920" height="42" rx="10" fill="#eaf3f5" stroke="#c7dfe4"/>
<rect x="40" y="520" width="5" height="42" rx="2.5" fill="#0b7285"/>
<text class="callout-text" x="58" y="547" fill="#0b2239">The same admitted scene revision and ordered inputs produce the authoritative simulation state.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" role="img" aria-labelledby="title desc">
  <title id="title">Twin folder layout</title>
  <desc id="desc">A Twin is a folder containing twin.toml plus a USD scene, Modelica models, Rhai scenarios, SysML requirements, and Assets.toml. The .lunco folder holds local session state.</desc>
  <style>
    .canvas { fill: #f7f9fc; }
    .title { fill: #162033; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 28px; font-weight: 700; }
    .subtitle { fill: #5b677a; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; }
    .panel { fill: #ffffff; stroke: #c8d2e0; stroke-width: 1.5; }
    .folder { fill: #162033; font-family: SFMono-Regular, Consolas, monospace; font-size: 20px; font-weight: 700; }
    .file { fill: #253149; font-family: SFMono-Regular, Consolas, monospace; font-size: 17px; }
    .comment { fill: #6a7689; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; }
    .lead { fill: #445066; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 15px; }
    .lead-strong { fill: #162033; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 700; }
    .tag { fill: #ffffff; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
  </style>

  <rect class="canvas" x="0" y="0" width="700" height="450"/>

  <text class="title" x="36" y="38">A Twin is a folder with a manifest</text>
  <text class="subtitle" x="36" y="62">twin.toml is the only required file. Everything else is an ordinary domain document.</text>

  <rect class="panel" x="36" y="82" width="330" height="324" rx="12"/>

  <text class="folder" x="54" y="116">my-rover-twin/</text>
  <text class="file" x="72" y="146">twin.toml</text>
  <text class="comment" x="218" y="146">manifest</text>
  <text class="file" x="72" y="176">scene.usda</text>
  <text class="comment" x="218" y="176">default scene</text>
  <text class="file" x="72" y="206">models/Drive.mo</text>
  <text class="comment" x="218" y="206">behavior</text>
  <text class="file" x="72" y="236">scenarios/drive.rhai</text>
  <text class="comment" x="280" y="236">policy</text>
  <text class="file" x="72" y="266">Assets.toml</text>
  <text class="comment" x="218" y="266">external bytes</text>
  <text class="file" x="72" y="296">requirements.sysml</text>
  <text class="comment" x="266" y="296">optional</text>
  <text class="file" x="72" y="326">.lunco/</text>
  <text class="comment" x="218" y="326">session state</text>
  <text class="file" x="72" y="356">engine/</text>
  <text class="comment" x="218" y="356">child Twin</text>

  <rect x="386" y="82" width="278" height="68" rx="10" fill="#e8eef8" stroke="#b9c8dd"/>
  <rect x="400" y="94" width="60" height="21" rx="5" fill="#254f8f"/>
  <text class="tag" x="410" y="109">ENTRY</text>
  <text class="lead-strong" x="400" y="132">twin.toml selects the world.</text>
  <text class="lead" x="400" y="150">default_scene is Twin-relative.</text>

  <rect x="386" y="162" width="278" height="68" rx="10" fill="#eaf3ee" stroke="#9fc7b2"/>
  <rect x="400" y="174" width="60" height="21" rx="5" fill="#2f7a55"/>
  <text class="tag" x="410" y="189">SCENE</text>
  <text class="lead-strong" x="400" y="212">USD owns structure.</text>
  <text class="lead" x="400" y="230">hierarchy, physics, ports.</text>

  <rect x="386" y="242" width="278" height="68" rx="10" fill="#f2ecfa" stroke="#c0a8da"/>
  <rect x="400" y="254" width="84" height="21" rx="5" fill="#6a3d9a"/>
  <text class="tag" x="410" y="269">BEHAVIOR</text>
  <text class="lead-strong" x="400" y="292">Modelica owns state.</text>
  <text class="lead" x="400" y="310">equations and parameters.</text>

  <rect x="386" y="322" width="278" height="68" rx="10" fill="#fdf2e7" stroke="#dcb98c"/>
  <rect x="400" y="334" width="60" height="21" rx="5" fill="#a8611b"/>
  <text class="tag" x="410" y="349">POLICY</text>
  <text class="lead-strong" x="400" y="372">Rhai owns sequencing.</text>
  <text class="lead" x="400" y="390">events and objectives.</text>

  <rect x="36" y="418" width="628" height="22" rx="5" fill="#ffffff" stroke="#c8d2e0"/>
  <text class="lead" x="50" y="434">.lunco/ is session state, not content. Commit the manifest and domain files.</text>
</svg>

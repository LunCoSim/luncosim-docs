<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">One fact, one owner</title>
<desc id="desc">The Twin manifest selects authored sources; LunCoSim composes and advances them without duplicating domain facts.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0b7285"/>
  </marker>
</defs>
<style>
  .canvas { fill: #f3f7f9; }
  .title { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -.3px; }
  .subtitle { fill: #5e707d; font-family: system-ui, sans-serif; font-size: 15px; }
  .eyebrow { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
  .light-title { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; }
  .light-body { fill: #d7e5ec; font-family: system-ui, sans-serif; font-size: 16px; }
  .node-title { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; }
  .body { fill: #243847; font-family: system-ui, sans-serif; font-size: 15px; }
  .label { fill: #5e707d; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
  .callout-text { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
</style>
<rect class="canvas" width="1000" height="580" rx="12"/>
<text class="title" x="40" y="46">One fact, one owner</text>
<text class="subtitle" x="40" y="74">Standard files keep their own responsibilities. The runtime brings them together.</text><rect x="40" y="100" width="920" height="82" rx="14" fill="#e7f0f4" stroke="#c8d7df" stroke-width="1.5"/><text class="eyebrow" x="62" y="126" fill="#0b7285">PROJECT ENTRY</text><text class="node-title" x="62" y="153">twin.toml</text><text class="body" x="225" y="153" fill="#5e707d">Selects the default scene and declares Twin roots and settings.</text><rect x="40" y="225" width="215" height="160" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="40" y="239" width="5" height="132" rx="2.5" fill="#28785e"/>
<text class="eyebrow" x="60" y="253" fill="#28785e">SCENE</text>
<text class="node-title" x="60" y="281">USD</text>
<text class="body" x="60" y="307" fill="#5e707d" font-size="15px"><tspan x="60" dy="0">Structure, geometry,</tspan><tspan x="60" dy="20">physics and typed ports;</tspan><tspan x="60" dy="20">may reference glTF.</tspan></text><path d="M147 182 L147 216" fill="none" stroke="#c8d7df" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="275" y="225" width="215" height="160" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="275" y="239" width="5" height="132" rx="2.5" fill="#6951a1"/>
<text class="eyebrow" x="295" y="253" fill="#6951a1">BEHAVIOR</text>
<text class="node-title" x="295" y="281">Modelica</text>
<text class="body" x="295" y="307" fill="#5e707d" font-size="15px"><tspan x="295" dy="0">Continuous equations,</tspan><tspan x="295" dy="20">parameters and state.</tspan></text><path d="M382 182 L382 216" fill="none" stroke="#c8d7df" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="510" y="225" width="215" height="160" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="510" y="239" width="5" height="132" rx="2.5" fill="#a96320"/>
<text class="eyebrow" x="530" y="253" fill="#a96320">POLICY</text>
<text class="node-title" x="530" y="281">Rhai</text>
<text class="body" x="530" y="307" fill="#5e707d" font-size="15px"><tspan x="530" dy="0">Events, tasks,</tspan><tspan x="530" dy="20">commands and objectives.</tspan></text><path d="M617 182 L617 216" fill="none" stroke="#c8d7df" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="745" y="225" width="215" height="160" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="745" y="239" width="5" height="132" rx="2.5" fill="#0b7285"/>
<text class="eyebrow" x="765" y="253" fill="#0b7285">EXTERNAL BYTES</text>
<text class="node-title" x="765" y="281">Assets.toml</text>
<text class="body" x="765" y="307" fill="#5e707d" font-size="15px"><tspan x="765" dy="0">Libraries, DEMs,</tspan><tspan x="765" dy="20">hashes and processing.</tspan></text><path d="M852 182 L852 216" fill="none" stroke="#c8d7df" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M147 385 L147 423" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M382 385 L382 423" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M617 385 L617 423" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M852 385 L852 423" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="425" width="920" height="74" rx="14" fill="#0b2239"/><text class="light-title" x="64" y="456">LunCoSim runtime</text><text class="light-body" x="278" y="456">Compose  ·  project  ·  schedule  ·  simulate  ·  render</text><rect x="40" y="520" width="920" height="42" rx="10" fill="#eaf3f5" stroke="#c7dfe4"/>
<rect x="40" y="520" width="5" height="42" rx="2.5" fill="#0b7285"/>
<text class="callout-text" x="58" y="547" fill="#0b2239">Keep each fact in the format that owns it; the runtime builds the live world.</text>
</svg>

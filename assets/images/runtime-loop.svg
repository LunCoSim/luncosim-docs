<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-labelledby="title desc">
  <title id="title">LunCoSim runtime loop</title>
  <desc id="desc">Authored USD, Modelica, Rhai, and Assets.toml are composed and projected into a live world. The fixed clock advances Modelica and physics, events and typed commands feed back into Rhai policy, and presentation renders the result.</desc>
  <style>
    .canvas { fill: #f7f9fc; }
    .title { fill: #162033; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 28px; font-weight: 700; }
    .subtitle { fill: #5b677a; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; }
    .box { stroke-width: 1.5; }
    .box-title { fill: #162033; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 700; }
    .box-body { fill: #445066; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; }
    .arrow { stroke: #7a879c; stroke-width: 2; fill: none; }
    .arrow-strong { stroke: #254f8f; stroke-width: 2.4; fill: none; }
    .label { fill: #5b677a; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 600; }
    .num { fill: #ffffff; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 700; }
  </style>

  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a879c"/>
    </marker>
    <marker id="head-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#254f8f"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="700" height="500"/>

  <text class="title" x="36" y="38">From authored files to a live world</text>
  <text class="subtitle" x="36" y="62">The runtime owns the loop. A composed USD stage by itself does nothing.</text>

  <rect class="box" x="36" y="92" width="190" height="98" rx="10" fill="#e8eef8" stroke="#b9c8dd"/>
  <circle cx="58" cy="116" r="13" fill="#254f8f"/>
  <text class="num" x="54" y="120">1</text>
  <text class="box-title" x="78" y="121">Author</text>
  <text class="box-body" x="54" y="146">twin.toml, scene.usda</text>
  <text class="box-body" x="54" y="166">models, scenarios</text>
  <text class="box-body" x="54" y="186">Assets.toml</text>

  <rect class="box" x="240" y="92" width="190" height="98" rx="10" fill="#eaf3ee" stroke="#9fc7b2"/>
  <circle cx="262" cy="116" r="13" fill="#2f7a55"/>
  <text class="num" x="258" y="120">2</text>
  <text class="box-title" x="282" y="121">Compose</text>
  <text class="box-body" x="258" y="146">resolve references,</text>
  <text class="box-body" x="258" y="166">variants, connections</text>
  <text class="box-body" x="258" y="186">project to entities</text>

  <rect class="box" x="444" y="92" width="190" height="98" rx="10" fill="#f2ecfa" stroke="#c0a8da"/>
  <circle cx="466" cy="116" r="13" fill="#6a3d9a"/>
  <text class="num" x="462" y="120">3</text>
  <text class="box-title" x="486" y="121">Advance clock</text>
  <text class="box-body" x="462" y="146">fixed master clock</text>
  <text class="box-body" x="462" y="166">Modelica exchange</text>
  <text class="box-body" x="462" y="186">Avian physics</text>

  <rect class="box" x="36" y="248" width="190" height="98" rx="10" fill="#ffffff" stroke="#c8d2e0"/>
  <circle cx="58" cy="272" r="13" fill="#315f91"/>
  <text class="num" x="54" y="276">6</text>
  <text class="box-title" x="78" y="277">Inspect + test</text>
  <text class="box-body" x="54" y="302">read ports and state</text>
  <text class="box-body" x="54" y="322">graphs, screenshots</text>
  <text class="box-body" x="54" y="342">Rhai verdict</text>

  <rect class="box" x="240" y="248" width="190" height="98" rx="10" fill="#e8eef8" stroke="#b9c8dd"/>
  <circle cx="262" cy="272" r="13" fill="#254f8f"/>
  <text class="num" x="258" y="276">5</text>
  <text class="box-title" x="282" y="277">Present</text>
  <text class="box-body" x="258" y="302">camera, terrain</text>
  <text class="box-body" x="258" y="322">HUD and graphs</text>
  <text class="box-body" x="258" y="342">UI sends commands</text>

  <rect class="box" x="444" y="248" width="190" height="98" rx="10" fill="#fdf2e7" stroke="#dcb98c"/>
  <circle cx="466" cy="272" r="13" fill="#a8611b"/>
  <text class="num" x="462" y="276">4</text>
  <text class="box-title" x="486" y="277">Observe</text>
  <text class="box-body" x="462" y="302">events to on_event</text>
  <text class="box-body" x="462" y="322">tasks and objectives</text>
  <text class="box-body" x="462" y="342">typed commands</text>

  <path class="arrow" marker-end="url(#head)" d="M226 141 L240 141"/>
  <path class="arrow" marker-end="url(#head)" d="M430 141 L444 141"/>
  <path class="arrow" marker-end="url(#head)" d="M539 190 L539 248"/>
  <path class="arrow" marker-end="url(#head)" d="M444 297 L430 297"/>
  <path class="arrow" marker-end="url(#head)" d="M240 297 L226 297"/>

  <path class="arrow-strong" marker-end="url(#head-strong)" d="M131 346 L131 386 L539 386 L539 346"/>
  <text class="label" x="230" y="402">commands and input feed the next fixed step</text>

  <rect class="box" x="36" y="420" width="628" height="56" rx="9" fill="#162033" stroke="#162033"/>
  <text class="box-body" x="54" y="444" fill="#c8d4e6">The loop is deterministic for the same admitted scene revision and ordered inputs.</text>
  <text class="box-body" x="54" y="464" fill="#c8d4e6">UI responsiveness never chooses authoritative state.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">Rover signals at each fixed step</title>
<desc id="desc">Rhai latches throttle and steering inputs, Modelica computes wheel torques, and the Avian chassis advances the wheels.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0b7285"/>
  </marker>
</defs>
<style>
  .canvas { fill: #f3f7f9; }
  .title { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -.3px; }
  .subtitle { fill: #5e707d; font-family: system-ui, sans-serif; font-size: 15px; }
  .eyebrow { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
  .node-title { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; }
  .body { fill: #243847; font-family: system-ui, sans-serif; font-size: 15px; }
  .label { fill: #5e707d; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
  .callout-text { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
</style>
<rect class="canvas" width="1000" height="610" rx="12"/>
<text class="title" x="40" y="46">Rover signals at each fixed step</text>
<text class="subtitle" x="40" y="74">Each stage consumes typed ports owned by the corresponding USD prim or simulation participant.</text><rect x="40" y="125" width="280" height="138" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="40" y="139" width="5" height="110" rx="2.5" fill="#a96320"/>
<text class="eyebrow" x="60" y="153" fill="#a96320">MISSION</text>
<text class="node-title" x="60" y="181">Rhai</text>
<text class="body" x="60" y="207" fill="#5e707d" font-size="15px"><tspan x="60" dy="0">SetPorts { throttle,</tspan><tspan x="60" dy="20">steer }</tspan></text><rect x="360" y="125" width="280" height="138" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="360" y="139" width="5" height="110" rx="2.5" fill="#28785e"/>
<text class="eyebrow" x="380" y="153" fill="#28785e">INPUTS</text>
<text class="node-title" x="380" y="181" family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Controller</text>
<text class="body" x="380" y="207" fill="#5e707d" font-size="15px" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan x="380" dy="0">inputs:throttle</tspan><tspan x="380" dy="20">inputs:steer</tspan></text><rect x="680" y="125" width="280" height="138" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="680" y="139" width="5" height="110" rx="2.5" fill="#6951a1"/>
<text class="eyebrow" x="700" y="153" fill="#6951a1">SOLVER</text>
<text class="node-title" x="700" y="181">Modelica Drive</text>
<text class="body" x="700" y="207" fill="#5e707d" font-size="15px"><tspan x="700" dy="0">left_torque</tspan><tspan x="700" dy="20">right_torque</tspan></text><path d="M320 194 L352 194" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M640 194 L672 194" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="360" y="340" width="280" height="138" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="360" y="354" width="5" height="110" rx="2.5" fill="#28785e"/>
<text class="eyebrow" x="380" y="368" fill="#28785e">CHASSIS</text>
<text class="node-title" x="380" y="396" family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">USD component</text>
<text class="body" x="380" y="422" fill="#5e707d" font-size="15px" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan x="380" dy="0">inputs:left_torque</tspan><tspan x="380" dy="20">inputs:right_torque</tspan></text><rect x="40" y="340" width="280" height="138" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="40" y="354" width="5" height="110" rx="2.5" fill="#0b7285"/>
<text class="eyebrow" x="60" y="368" fill="#0b7285">PHYSICS</text>
<text class="node-title" x="60" y="396">Avian wheels</text>
<text class="body" x="60" y="422" fill="#5e707d" font-size="15px"><tspan x="60" dy="0">Torque integrates</tspan><tspan x="60" dy="20">into wheel motion</tspan></text><path d="M820 263 V300 H500 V340" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M360 409 H320" fill="none" stroke="#0b7285" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="label" x="655" y="280" fill="#5e707d">wheel torques</text><rect x="40" y="525" width="920" height="42" rx="10" fill="#eaf3f5" stroke="#c7dfe4"/>
<rect x="40" y="525" width="5" height="42" rx="2.5" fill="#0b7285"/>
<text class="callout-text" x="58" y="552" fill="#0b2239">Latched inputs → Modelica step → chassis torques → physics integration.</text>
</svg>

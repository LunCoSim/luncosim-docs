<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">A Twin is a folder with a manifest</title>
<desc id="desc">The Twin folder keeps a manifest, ordinary domain files, optional external assets, local session state, and child Twins together.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0b7285"/>
  </marker>
</defs>
<style>
  .canvas { fill: #f3f7f9; }
  .title { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -.3px; }
  .subtitle { fill: #5e707d; font-family: system-ui, sans-serif; font-size: 15px; }
  .eyebrow { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
  .node-title { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; }
  .body { fill: #243847; font-family: system-ui, sans-serif; font-size: 15px; }
  .label { fill: #5e707d; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
  .callout-text { fill: #0b2239; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
</style>
<rect class="canvas" width="1000" height="570" rx="12"/>
<text class="title" x="40" y="46">A Twin is a folder with a manifest</text>
<text class="subtitle" x="40" y="74">twin.toml is required. Other files are included when the project needs them.</text><rect x="40" y="112" width="470" height="380" rx="15" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/><path d="M40 155 V130 Q40 112 58 112 H190 L216 137 H492 Q510 137 510 155" fill="#dcecf1" stroke="#c8d7df" stroke-width="1.5"/><text class="node-title" x="66" y="151" fill="#0b2239" font-family="ui-monospace, monospace">my-rover-twin/</text><circle cx="72" cy="189" r="5" fill="#0b7285"/><text class="body" x="91" y="194" fill="#0b2239" font-size="15px" font-family="ui-monospace, SFMono-Regular, monospace">twin.toml</text><text class="body" x="280" y="194" fill="#5e707d" font-size="14px">entry scene and roots</text><circle cx="72" cy="228" r="5" fill="#28785e"/><text class="body" x="91" y="233" fill="#0b2239" font-size="15px" font-family="ui-monospace, SFMono-Regular, monospace">scene.usda</text><text class="body" x="280" y="233" fill="#5e707d" font-size="14px">USD structure and topology</text><circle cx="72" cy="267" r="5" fill="#6951a1"/><text class="body" x="91" y="272" fill="#0b2239" font-size="15px" font-family="ui-monospace, SFMono-Regular, monospace">models/*.mo</text><text class="body" x="280" y="272" fill="#5e707d" font-size="14px">Modelica behavior</text><circle cx="72" cy="306" r="5" fill="#a96320"/><text class="body" x="91" y="311" fill="#0b2239" font-size="15px" font-family="ui-monospace, SFMono-Regular, monospace">scenarios/*.rhai</text><text class="body" x="280" y="311" fill="#5e707d" font-size="14px">Rhai mission policy</text><circle cx="72" cy="345" r="5" fill="#0b7285"/><text class="body" x="91" y="350" fill="#0b2239" font-size="15px" font-family="ui-monospace, SFMono-Regular, monospace">Assets.toml</text><text class="body" x="280" y="350" fill="#5e707d" font-size="14px">external data, including glTF</text><circle cx="72" cy="384" r="5" fill="#5e707d"/><text class="body" x="91" y="389" fill="#0b2239" font-size="15px" font-family="ui-monospace, SFMono-Regular, monospace">.lunco/</text><text class="body" x="280" y="389" fill="#5e707d" font-size="14px">local session state</text><circle cx="72" cy="423" r="5" fill="#5e707d"/><text class="body" x="91" y="428" fill="#0b2239" font-size="15px" font-family="ui-monospace, SFMono-Regular, monospace">engine/</text><text class="body" x="280" y="428" fill="#5e707d" font-size="14px">child Twin</text><rect x="550" y="125" width="410" height="104" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="550" y="139" width="5" height="76" rx="2.5" fill="#0b7285"/>
<text class="eyebrow" x="570" y="153" fill="#0b7285">ENTRY</text>
<text class="node-title" x="570" y="181">Manifest selects the world</text>
<text class="body" x="570" y="207" fill="#5e707d" font-size="15px"><tspan x="570" dy="0">default_scene is Twin-relative.</tspan></text><rect x="550" y="250" width="410" height="104" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="550" y="264" width="5" height="76" rx="2.5" fill="#28785e"/>
<text class="eyebrow" x="570" y="278" fill="#28785e">DOMAIN FILES</text>
<text class="node-title" x="570" y="306">Each format owns one layer</text>
<text class="body" x="570" y="332" fill="#5e707d" font-size="15px"><tspan x="570" dy="0">USD · Modelica · Rhai</tspan></text><rect x="550" y="375" width="410" height="104" rx="13" fill="#ffffff" stroke="#c8d7df" stroke-width="1.5"/>
<rect x="550" y="389" width="5" height="76" rx="2.5" fill="#a96320"/>
<text class="eyebrow" x="570" y="403" fill="#a96320">LOCAL + NESTED</text>
<text class="node-title" x="570" y="431">Keep project and session apart</text>
<text class="body" x="570" y="457" fill="#5e707d" font-size="15px"><tspan x="570" dy="0">.lunco/ is local; child Twins are folders.</tspan></text><rect x="40" y="515" width="920" height="42" rx="10" fill="#eaf3f5" stroke="#c7dfe4"/>
<rect x="40" y="515" width="5" height="42" rx="2.5" fill="#0b7285"/>
<text class="callout-text" x="58" y="542" fill="#0b2239">Commit the manifest and domain files. Session state stays local unless you choose to share it.</text>
</svg>

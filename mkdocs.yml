site_name: LunCoSim Documentation
site_description: Documentation for LunCoSim, an open-source space mission workbench built on USD, Modelica, and Rhai.
site_url: https://luncosim.github.io/luncosim-docs/
repo_url: https://github.com/LunCoSim/luncosim-docs
repo_name: LunCoSim/luncosim-docs
edit_uri: edit/main/docs/
copyright: LunCoSim contributors · Documentation version 0.1 · November 2026

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/luncosim-icon.png
  favicon: assets/images/luncosim-icon.png
  language: en
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - 1 General:
      - 1 General: general/index.md
      - 1.1 Introduction: general/introduction.md
      - 1.2 How it fits together: general/how-it-fits-together.md
      - 1.3 Formats: general/formats.md
      - 1.4 Installation: general/install.md
      - 1.5 First run: general/first-run.md
      - 1.6 Perspectives: general/perspectives.md
      - 1.7 Twins: general/twins.md
      - 1.8 Integrate your stack: general/integrate-your-stack.md
      - 1.9 Glossary: general/glossary.md
  - 2 Tutorials:
